<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库客服</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;
  background:#ffffff;
  color:#1f2937;
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* ========== 登录页面 ========== */
.login-page{
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:#f5f5f5;
  display:flex; align-items:center; justify-content:center;
  z-index:9999;
}
.login-page.hidden{ display:none; }
.login-card{
  background:#fff;
  border-radius:12px;
  padding:40px 36px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
  text-align:center;
  max-width:360px;
  width:90%;
}
.login-title{
  font-size:20px; font-weight:600; color:#1f2937; margin-bottom:6px;
}
.login-subtitle{
  font-size:14px; color:#888; margin-bottom:28px;
}
.login-btn{
  width:100%;
  padding:12px 20px;
  background:#24292e;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:15px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:background .2s;
}
.login-btn:hover{ background:#1a1e22; }
.login-btn svg{ width:20px; height:20px; fill:currentColor; }

/* ========== 左侧侧边栏 ========== */
.sidebar{
  width:260px;
  background:#111827;
  color:#e5e7eb;
  display:flex;
  flex-direction:column;
  padding:16px 12px;
}
/* 侧边栏顶部用户区域 */
.sidebar-top-user{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 6px 16px;
  border-bottom:1px solid #272f3f;
  margin-bottom:16px;
}
.user-avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#3b82f6;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  flex-shrink:0;
  cursor:pointer;
  overflow:hidden;
}
.user-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.user-name{
  font-size:14px;
  color:#e5e7eb;
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.logout-btn{
  background:none;
  border:none;
  color:#9ca3af;
  cursor:pointer;
  font-size:12px;
  padding:4px 8px;
  border-radius:4px;
  transition:color 0.2s;
}
.logout-btn:hover{
  color:#fff;
}

/* 添加知识库文档按钮 */
.upload-doc-btn{
  width:100%;
  padding:10px 14px;
  background:#2563eb;
  border:none;
  border-radius:10px;
  color:#fff;
  cursor:pointer;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  transition:opacity 0.2s;
}
.upload-doc-btn:hover{
  opacity:0.9;
}

.new-chat-btn{
  width:100%;
  padding:10px 14px;
  background:#1f2937;
  border:1px solid #374151;
  border-radius:10px;
  color:#f9fafb;
  cursor:pointer;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:20px;
  transition:background 0.2s;
}
.new-chat-btn:hover{
  background:#374151;
}

.history-title{
  font-size:12px;
  color:#9ca3af;
  padding:0 6px 8px;
}
.history-list{
  flex:1;
  overflow-y:auto;
}
.history-item{
  padding:9px 10px;
  border-radius:8px;
  font-size:14px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:4px;
}
.history-item:hover{
  background:#1f2937;
}
.history-item.active{
  background:#273449;
}

/* ========== 右侧对话主区域 ========== */
.main-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#f9fafb;
}
.header{
  height:52px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  padding:0 20px;
  font-size:15px;
  font-weight:600;
  color:#374151;
}
.messages{
  flex:1;
  overflow-y:auto;
  padding:24px 0;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.msg-wrap{
  width:100%;
  max-width:720px;
  padding:0 24px;
  display:flex;
  margin-bottom:18px;
}
.msg-wrap.user{ justify-content:flex-end; }
.msg-wrap.ai{ justify-content:flex-start; }
.msg{
  max-width:85%;
  line-height:1.75;
  font-size:15px;
  padding:10px 16px;
  border-radius:16px;
  word-break:break-word;
  white-space:pre-wrap;
}
.msg-wrap.user .msg{
  background:#1677ff;
  color:#fff;
  border-bottom-right-radius:4px;
}
.msg-wrap.ai .msg{
  background:#fff;
  color:#1f2937;
  border:1px solid #e5e7eb;
  border-bottom-left-radius:4px;
}
.tool-wrap{
  width:100%;
  max-width:720px;
  padding:0 24px;
  margin-bottom:4px;
  display:flex;
}
.tool{
  color:#9ca3af;
  font-size:12px;
  padding:2px 0;
}
.input-wrap{
  background:#fff;
  border-top:1px solid #e5e7eb;
  padding:14px 0;
}
.input-box{
  max-width:720px;
  margin:0 auto;
  padding:0 24px;
  display:flex;
  gap:8px;
  align-items:flex-end;
}
.input-box textarea{
  flex:1;
  border:1px solid #d1d5db;
  outline:none;
  font-size:15px;
  padding:10px 14px;
  border-radius:12px;
  min-height:44px;
  max-height:160px;
  resize:none;
  background:#fff;
  font-family:inherit;
}
.input-box textarea:focus{
  border-color:#1677ff;
  box-shadow:0 0 0 2px rgba(22,119,255,.15);
}
.input-box button{
  padding:10px 20px;
  background:#1677ff;
  color:#fff;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
  flex-shrink:0;
  transition:background .2s;
}
.input-box button:hover{ background:#0958d9; }
.input-box textarea{
  flex:1;
  border:none;
  outline:none;
  font-size:15px;
  min-height:44px;
  max-height:160px;
  resize:none;
  background:transparent;
}
.input-box button{
  padding:10px 22px;
  background:#1677ff;
  color:#fff;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;
  transition:opacity 0.2s;
}
.input-box button:hover{
  opacity:0.9;
}

/* 滚动条美化 */
.messages::-webkit-scrollbar,
.history-list::-webkit-scrollbar{
  width:6px;
}
.messages::-webkit-scrollbar-thumb,
.history-list::-webkit-scrollbar-thumb{
  background:#d1d5db;
  border-radius:3px;
}
.history-list::-webkit-scrollbar-track{
  background:transparent;
}
</style>
</head>
<body>

<!-- 登录页面 -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <h1 class="login-title">知识库客服</h1>
    <p class="login-subtitle">使用 GitHub 账号登录</p>
    <button class="login-btn" onclick="loginWithGithub()">
      <svg viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
      GitHub 登录
    </button>
  </div>
</div>

<!-- 主应用界面 -->
<div id="appContainer" style="display:none; width:100%; height:100%;">
  <!-- 左侧侧边栏 -->
  <div class="sidebar">
    <!-- 左上角用户头像区域 -->
    <div class="sidebar-top-user">
      <div class="user-avatar" id="userAvatar">U</div>
      <div class="user-name" id="userName">登录用户</div>
      <button class="logout-btn" onclick="logout()">登出</button>
    </div>

    <!-- 顺序调整：上传文档放在最上方 -->
    <button class="upload-doc-btn" id="rebuildBtn">🔄 重建索引</button>
    <button class="upload-doc-btn" id="uploadDocBtn">📄 添加知识库文档</button>
    <button class="new-chat-btn" id="newChatBtn">＋ 新对话</button>

    <div class="history-title">历史对话</div>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- 右侧对话区域 -->
  <div class="main-wrap">
    <div class="header">知识库客服</div>
    <div class="messages" id="messages"></div>

    <div class="input-wrap">
      <div class="input-box">
        <textarea id="userInput" placeholder="输入问题，回车发送，Shift+Enter换行"></textarea>
        <button onclick="send()">发送</button>
      </div>
    </div>
  </div>
</div>

<script>
// ========= 全局状态 =========
let sessionId = null;
let currentUser = null;

const msgs = document.getElementById("messages");
const historyList = document.getElementById("historyList");
const newChatBtn = document.getElementById("newChatBtn");
const rebuildBtn = document.getElementById("rebuildBtn");
const uploadDocBtn = document.getElementById("uploadDocBtn");

let threadId = Math.random().toString(36).slice(2);
let abortController = null;
let chatHistory = [];

// ========= 登录相关 =========

// 检查 URL 参数中的 session
function checkUrlSession() {
  const params = new URLSearchParams(window.location.search);
  const session = params.get('session');
  if (session) {
    sessionId = session;
    localStorage.setItem('session_id', session);
    // 清除 URL 参数
    window.history.replaceState({}, document.title, window.location.pathname);
  } else {
    sessionId = localStorage.getItem('session_id');
  }
}

// 检查登录状态
async function checkLoginStatus() {
  checkUrlSession();
  
  if (!sessionId) {
    showLoginPage();
    return;
  }
  
  try {
    const resp = await fetch('/api/auth/me', {
      headers: { 'X-Session-Id': sessionId }
    });
    const data = await resp.json();
    
    if (data.logged_in && data.user) {
      currentUser = data.user;
      showAppPage();
    } else {
      showLoginPage();
    }
  } catch (e) {
    showLoginPage();
  }
}

// 显示登录页面
function showLoginPage() {
  document.getElementById('loginPage').classList.remove('hidden');
  document.getElementById('appContainer').style.display = 'none';
}

// 显示应用页面
function showAppPage() {
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('appContainer').style.display = 'flex';
  
  // 更新用户信息
  if (currentUser) {
    const avatarEl = document.getElementById('userAvatar');
    const nameEl = document.getElementById('userName');
    
    if (currentUser.avatar_url) {
      avatarEl.innerHTML = `<img src="${currentUser.avatar_url}" alt="avatar">`;
    } else {
      avatarEl.textContent = currentUser.username.charAt(0).toUpperCase();
    }
    nameEl.textContent = currentUser.username;
  }
  
  // 初始化应用
  loadConversations().then(() => renderHistory());
  checkKBStatus();
}

// GitHub 登录
async function loginWithGithub() {
  try {
    const resp = await fetch('/api/auth/github');
    const data = await resp.json();
    
    if (data.auth_url) {
      window.location.href = data.auth_url;
    }
  } catch (e) {
    alert('登录失败，请重试');
  }
}

// 登出
async function logout() {
  try {
    await fetch('/api/auth/logout', { method: 'POST' });
  } catch (e) {}
  
  sessionId = null;
  currentUser = null;
  localStorage.removeItem('session_id');
  showLoginPage();
}

// ========= 聊天相关 =========

// 添加知识库文档点击事件
uploadDocBtn.onclick = function(){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".txt,.md,.pdf";
  input.multiple = true;
  input.onchange = async () => {
    for (const f of input.files) {
      const form = new FormData();
      form.append("file", f);
      await fetch("/api/kb/upload", { method: "POST", body: form });
    }
    checkKBStatus();
    alert("已上传 " + input.files.length + " 个文件，点击\"重建索引\"生效。");
  };
  input.click();
};

// 从后端加载对话列表
async function loadConversations() {
  if (!sessionId) return;
  try {
    const resp = await fetch("/api/conversations", {
      headers: { "X-Session-Id": sessionId }
    });
    const data = await resp.json();
    chatHistory = data.conversations || [];
  } catch (e) {
    chatHistory = [];
  }
}

// 渲染侧边历史列表
function renderHistory(){
  historyList.innerHTML = "";
  chatHistory.forEach((item)=>{
    const div = document.createElement("div");
    div.className = "history-item" + (item.thread_id === threadId ? " active" : "");
    div.textContent = item.title || "未命名";
    div.title = item.title;
    div.onclick = ()=>switchChat(item.thread_id);
    historyList.appendChild(div);
  });
}

// 切换会话
async function switchChat(tid){
  threadId = tid;
  msgs.innerHTML = "";

  // 从后端加载该对话的历史消息
  if (sessionId) {
    try {
      const resp = await fetch("/api/conversations/" + tid, {
        headers: { "X-Session-Id": sessionId }
      });
      const data = await resp.json();
      for (const m of (data.messages || [])) {
        addMsg(m.role === "human" ? "user" : "ai", m.content);
      }
    } catch (e) {}
  }

  renderHistory();
}

// 新建对话
newChatBtn.onclick = function(){
  threadId = Math.random().toString(36).slice(2);
  msgs.innerHTML = "";
  renderHistory();
}

async function send() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  if (abortController) {
    abortController.abort();
    abortController = null;
  }

  addMsg("user", text);
  input.value = "";

  // 新对话：先刷新侧边栏
  const exist = chatHistory.find(c=>c.thread_id === threadId);
  if(!exist){
    chatHistory.unshift({
      title: text.slice(0,22) + (text.length>22?"...":""),
      thread_id: threadId
    });
    renderHistory();
  }

  const aiDiv = addMsg("ai", "");
  let fullText = "";

  abortController = new AbortController();

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Session-Id": sessionId
      },
      body: JSON.stringify({message: text, thread_id: threadId}),
      signal: abortController.signal,
    });

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";

    let end = false;
    while (!end) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});

      for (const line of buf.split("\n")) {
        if (!line.startsWith("data: ")) continue;
        const json = JSON.parse(line.slice(6));

        if (json.error) {
          aiDiv.textContent = "出错了：" + json.error;
        }
        if (json.tool) {
          const toolWrap = document.createElement("div");
          toolWrap.className = "tool-wrap";
          const toolDiv = document.createElement("div");
          toolDiv.className = "tool";
          toolDiv.textContent = "🔧 " + json.tool;
          toolWrap.appendChild(toolDiv);
          msgs.appendChild(toolWrap);
        }
        if (json.text) {
          fullText += json.text;
          aiDiv.textContent = fullText;
        }
        if (json.done) { end = true; break; }
      }
      buf = buf.split("\n").pop() || "";
      msgs.scrollTop = msgs.scrollHeight;
    }
  } catch (e) {
    if (e.name !== "AbortError") {
      aiDiv.textContent = "网络错误：" + e.message;
    }
  }

  abortController = null;

  // 刷新侧边栏对话列表（获取后端自动标题）
  loadConversations().then(() => renderHistory());
}

function addMsg(role, text) {
  const wrap = document.createElement("div");
  wrap.className = "msg-wrap " + role;

  const msg = document.createElement("div");
  msg.className = "msg";
  msg.textContent = text;
  wrap.appendChild(msg);
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
  return msg;
}

// 回车发送 Shift+Enter换行
document.getElementById('userInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    send();
  }
})

async function checkKBStatus() {
  try {
    const r = await fetch("/api/kb/status");
    const d = await r.json();
    const btn = document.getElementById("rebuildBtn");
    if (btn) {
      btn.textContent = "🔄 重建索引 (" + d.file_count + "个文档" + (d.has_index ? " ✅" : " ❌") + ")";
    }
  } catch(e) {}
}

rebuildBtn.onclick = async function() {
  rebuildBtn.textContent = "  重建中...";
  const r = await fetch("/api/kb/rebuild", { method: "POST" });
  const d = await r.json();
  rebuildBtn.textContent = "   重建索引 ";
  setTimeout(checkKBStatus, 2000);
};

// ========= 初始化 =========
checkLoginStatus();
</script>
</body>
</html>
