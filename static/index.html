<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库客服</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { brand: '#3157d5' }
      }
    }
  };
</script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f3f5f9;
    color: #172033;
    font-family: "Segoe UI", ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar::-webkit-scrollbar-thumb { background: #d7dce7; border-radius: 999px; }
  .scrollbar::-webkit-scrollbar-track { background: transparent; }
  .message-enter { animation: messageIn .25s ease-out; }
  @keyframes messageIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .conversation.active { background: #eef2ff; }
  .conversation.active .conv-title {
    color: #1e293b;
    font-weight: 600;
  }
  .conversation.active iconify-icon { color: #3157d5 !important; }

  .ai-content { white-space: normal; }
  .ai-content p { margin: 0 0 .6em; }
  .ai-content p:last-child { margin-bottom: 0; }
  .ai-content pre {
    background: #1e1e1e; color: #d4d4d4; padding: 12px 14px;
    border-radius: 8px; overflow-x: auto; margin: 8px 0; font-size: 13px; line-height: 1.5;
  }
  .ai-content code { font-family: "Cascadia Code", "Fira Code", ui-monospace, monospace; font-size: 13px; }
  .ai-content p code, .ai-content li code {
    background: #e8ecf4; color: #c0255c; padding: 2px 6px; border-radius: 4px;
  }
  .ai-content ul, .ai-content ol { padding-left: 1.25rem; margin: 6px 0; }
  .ai-content a { color: #3157d5; }
  .ai-content strong { font-weight: 600; color: #0f172a; }

  .login-page.hidden { display: none !important; }
  #appContainer { display: none; height: 100vh; }
  #appContainer.show { display: flex; }

  @media (max-width: 768px) {
    .app-shell { max-width: none !important; box-shadow: none !important; }
    aside.sidebar {
      display: none;
      position: fixed; inset: 0 auto 0 0; z-index: 100; height: 100%;
      width: min(292px, 86vw);
      box-shadow: 8px 0 30px rgba(34, 48, 80, 0.18);
    }
    aside.sidebar.mobile-open { display: flex; }
    .mobile-overlay {
      display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 99;
    }
    .mobile-overlay.show { display: block; }
  }
</style>
</head>
<body class="min-h-screen">

<!-- Tailwind 动态类预热（JS 创建气泡时用到） -->
<div class="hidden">
  <div class="message-enter mb-7 flex justify-end items-start gap-3"></div>
  <div class="max-w-[600px] max-w-[680px] min-w-0 flex-1"></div>
  <div class="mb-1.5 flex justify-end items-center gap-2"></div>
  <div class="rounded-2xl rounded-tr-md rounded-tl-md bg-[#3157d5] bg-[#f7f8fb] border border-slate-200 px-5 py-4 text-[14px] leading-7 text-white text-slate-700 shadow-sm whitespace-pre-wrap"></div>
  <div class="flex h-8 w-8 flex-none items-center justify-center overflow-hidden rounded-full bg-[#dce5ff] bg-[#3157d5] text-[12px] font-bold text-[#3157d5] text-white"></div>
  <div class="text-[12px] text-[10px] font-bold text-slate-800 text-slate-400"></div>
  <div class="ai-actions mt-2 flex gap-3 text-[11px] text-slate-400 hover:text-[#3157d5]"></div>
  <div class="mb-3 flex items-center gap-2 pl-11 text-[12px] text-slate-400"></div>
  <div class="conversation active flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left transition hover:bg-slate-100"></div>
  <span class="conv-title min-w-0 flex-1 truncate text-[13px] font-medium font-semibold text-slate-600 text-slate-800"></span>
</div>

<!-- 登录页 -->
<div class="login-page fixed inset-0 z-[9999] flex items-center justify-center bg-[#f3f5f9]" id="loginPage">
  <div class="w-[90%] max-w-[400px] rounded-2xl border border-slate-200 bg-white p-10 text-center shadow-[0_18px_60px_rgba(34,48,80,0.10)]">
    <div class="mx-auto mb-5 flex h-12 w-12 items-center justify-center rounded-xl bg-[#3157d5] text-white shadow-lg shadow-blue-200">
      <iconify-icon icon="solar:book-bookmark-bold" width="24"></iconify-icon>
    </div>
    <h1 class="text-[20px] font-bold tracking-tight text-slate-900">知识库客服</h1>
    <p class="mt-2 mb-8 text-[14px] text-slate-400">使用 GitHub 账号登录后开始对话</p>
    <button
      class="flex w-full items-center justify-center gap-2 rounded-xl bg-[#24292e] px-4 py-3 text-[14px] font-semibold text-white transition hover:bg-[#1a1e22] active:scale-[0.98]"
      onclick="loginWithGithub()"
    >
      <svg class="h-5 w-5 fill-current" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
      GitHub 登录
    </button>
  </div>
</div>

<div class="mobile-overlay" id="mobileOverlay" onclick="closeSidebar()"></div>

<!-- 主应用 -->
<div id="appContainer" class="app-shell min-h-screen w-full bg-white">

  <aside class="sidebar flex w-[292px] flex-none flex-col border-r border-slate-200 bg-[#f8f9fc]">
    <div class="flex items-center gap-3 border-b border-slate-200 px-6 py-5">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-[#3157d5] text-white shadow-lg shadow-blue-200">
        <iconify-icon icon="solar:book-bookmark-bold" width="22"></iconify-icon>
      </div>
      <div>
        <div class="text-[16px] font-bold tracking-tight text-slate-900">知识库客服</div>
        <div class="mt-0.5 text-[11px] font-medium text-slate-400">企业文档智能助手</div>
      </div>
      <button class="ml-auto text-slate-400 md:hidden" onclick="closeSidebar()" aria-label="关闭侧边栏">
        <iconify-icon icon="solar:close-circle-linear" width="22"></iconify-icon>
      </button>
    </div>

    <div class="px-4 pt-5">
      <button
        id="newChatBtn"
        class="flex w-full items-center justify-center gap-2 rounded-xl bg-[#3157d5] px-4 py-3 text-[13px] font-semibold text-white shadow-md shadow-blue-100 transition hover:bg-[#2649c0] active:scale-[0.98]"
      >
        <iconify-icon icon="solar:add-circle-bold" width="18"></iconify-icon>
        新建对话
      </button>
    </div>

    <div class="mx-4 mt-4 rounded-xl border border-slate-200 bg-white p-3">
      <div class="mb-2 flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-[0.12em] text-slate-400">
        <iconify-icon icon="solar:folder-with-files-linear" width="14"></iconify-icon>
        知识库
      </div>
      <button
        id="uploadDocBtn"
        class="mb-2 flex w-full items-center justify-center gap-1.5 rounded-lg border border-slate-200 bg-[#f8f9fc] px-3 py-2 text-[12px] font-medium text-slate-600 transition hover:border-blue-300 hover:text-[#3157d5]"
      >
        <iconify-icon icon="solar:upload-minimalistic-linear" width="16"></iconify-icon>
        添加文档
      </button>
      <button
        id="rebuildBtn"
        class="mb-2 flex w-full items-center justify-center gap-1.5 rounded-lg bg-[#eef2ff] px-3 py-2 text-[12px] font-medium text-[#3157d5] transition hover:bg-[#e0e7ff]"
      >
        <iconify-icon icon="solar:refresh-bold" width="15"></iconify-icon>
        <span id="rebuildBtnText">重建索引</span>
      </button>
      <div id="fileList" class="scrollbar max-h-[120px] overflow-y-auto"></div>
    </div>

    <div class="px-5 pb-2 pt-5 text-[11px] font-semibold uppercase tracking-[0.16em] text-slate-400">历史会话</div>
    <div class="scrollbar flex-1 overflow-y-auto px-3 pb-5" id="historyList"></div>

    <div class="border-t border-slate-200 p-4">
      <div class="flex items-center gap-3 rounded-xl px-2 py-2">
        <div id="userAvatar" class="flex h-9 w-9 flex-none items-center justify-center overflow-hidden rounded-full bg-[#dce5ff] text-[12px] font-bold text-[#3157d5]">U</div>
        <div class="min-w-0 flex-1">
          <div id="userName" class="truncate text-[13px] font-semibold text-slate-800">用户</div>
          <div class="text-[11px] text-slate-400">个人工作区</div>
        </div>
        <button onclick="logout()" aria-label="退出登录" class="text-slate-400 transition hover:text-slate-700" title="退出登录">
          <iconify-icon icon="solar:logout-2-linear" width="18"></iconify-icon>
        </button>
      </div>
    </div>
  </aside>

  <main class="flex min-w-0 flex-1 flex-col bg-white">
    <header class="flex h-[76px] flex-none items-center justify-between border-b border-slate-200 px-4 md:px-10">
      <div class="flex min-w-0 items-center gap-3">
        <button class="flex h-9 w-9 items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 md:hidden" onclick="toggleSidebar()" aria-label="打开菜单">
          <iconify-icon icon="solar:hamburger-menu-linear" width="22"></iconify-icon>
        </button>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <h1 id="chatTitle" class="truncate text-[18px] font-bold tracking-tight text-slate-900">新对话</h1>
            <span class="hidden rounded-md bg-emerald-50 px-2 py-1 text-[10px] font-semibold text-emerald-600 sm:inline">AI 在线</span>
          </div>
          <div id="chatSubtitle" class="mt-1 text-[12px] text-slate-400">对话内容已自动保存</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="document.getElementById('uploadDocBtn').click()" aria-label="上传文档" class="flex h-9 w-9 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-700" title="上传知识库文档">
          <iconify-icon icon="solar:paperclip-linear" width="19"></iconify-icon>
        </button>
      </div>
    </header>

    <section class="scrollbar flex-1 overflow-y-auto px-4 py-6 md:px-10 md:py-8" id="messages">
      <div class="mx-auto max-w-[820px]" id="messageInner">
        <div class="welcome flex flex-col items-center justify-center py-16 text-center" id="welcomeMsg">
          <div class="mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#3157d5] text-white shadow-lg shadow-blue-200">
            <iconify-icon icon="solar:stars-minimalistic-bold" width="28"></iconify-icon>
          </div>
          <div class="text-[18px] font-bold text-slate-800">你好，我是知识库助手</div>
          <div class="mt-2 max-w-[420px] text-[14px] leading-7 text-slate-400">
            可以问我关于文档的任何问题<br>比如「这个项目怎么部署？」「有哪些技术栈？」
          </div>
        </div>
      </div>
    </section>

    <footer class="flex-none px-4 pb-6 pt-2 md:px-10 md:pb-7">
      <div class="mx-auto max-w-[820px]">
        <div class="mb-3 flex flex-wrap gap-2" id="suggestionBar">
          <button type="button" class="suggestion rounded-lg border border-slate-200 bg-white px-3 py-2 text-[11px] text-slate-500 transition hover:border-blue-300 hover:text-[#3157d5]">这个项目怎么部署？</button>
          <button type="button" class="suggestion rounded-lg border border-slate-200 bg-white px-3 py-2 text-[11px] text-slate-500 transition hover:border-blue-300 hover:text-[#3157d5]">有哪些技术栈？</button>
          <button type="button" class="suggestion rounded-lg border border-slate-200 bg-white px-3 py-2 text-[11px] text-slate-500 transition hover:border-blue-300 hover:text-[#3157d5]">总结知识库内容</button>
        </div>
        <div class="rounded-2xl border border-slate-300 bg-white p-2 shadow-[0_8px_24px_rgba(31,49,91,0.08)] focus-within:border-[#3157d5] focus-within:ring-4 focus-within:ring-blue-50">
          <textarea
            id="userInput"
            rows="2"
            class="w-full resize-none border-0 bg-transparent px-3 py-2 text-[14px] leading-6 text-slate-800 outline-none placeholder:text-slate-400"
            placeholder="输入你的问题，按 Enter 发送，Shift + Enter 换行"
          ></textarea>
          <div class="flex items-center justify-between px-2 pb-1">
            <div class="flex items-center gap-1">
              <button type="button" onclick="document.getElementById('uploadDocBtn').click()" aria-label="添加附件" class="flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-700">
                <iconify-icon icon="solar:paperclip-linear" width="18"></iconify-icon>
              </button>
              <span class="ml-2 hidden text-[11px] text-slate-400 sm:inline">知识库检索 · 流式回答</span>
            </div>
            <button
              id="sendBtn"
              type="button"
              onclick="send()"
              class="flex items-center gap-2 rounded-xl bg-[#3157d5] px-4 py-2 text-[12px] font-semibold text-white transition hover:bg-[#2649c0] active:scale-[0.98]"
            >
              <span>发送</span>
              <iconify-icon icon="solar:arrow-up-linear" width="16"></iconify-icon>
            </button>
          </div>
        </div>
        <div class="mt-3 text-center text-[10px] text-slate-400">AI 生成内容可能存在偏差，请结合知识库原文判断</div>
      </div>
    </footer>
  </main>
</div>

<script>
let currentUser = null;
const msgs = document.getElementById("messages");
const messageInner = document.getElementById("messageInner");
const historyList = document.getElementById("historyList");
const newChatBtn = document.getElementById("newChatBtn");
const rebuildBtn = document.getElementById("rebuildBtn");
const uploadDocBtn = document.getElementById("uploadDocBtn");
const chatTitle = document.getElementById("chatTitle");

let threadId = Math.random().toString(36).slice(2);
let abortController = null;
let chatHistory = [];

marked.setOptions({ breaks: false, gfm: true });

function userInitial() {
  if (!currentUser || !currentUser.username) return "U";
  return currentUser.username.charAt(0).toUpperCase();
}

function userAvatarHtml() {
  if (currentUser && currentUser.avatar_url) {
    return `<img src="${currentUser.avatar_url}" alt="avatar" class="h-full w-full object-cover">`;
  }
  return userInitial();
}

function formatRelativeTime(iso) {
  if (!iso) return "";
  try {
    const t = new Date(iso).getTime();
    const diff = Date.now() - t;
    if (diff < 60_000) return "刚刚";
    if (diff < 3600_000) return Math.floor(diff / 60_000) + "分钟前";
    if (diff < 86400_000) return Math.floor(diff / 3600_000) + "小时前";
    if (diff < 172800_000) return "昨天";
    return new Date(iso).toLocaleDateString("zh-CN", { month: "numeric", day: "numeric" });
  } catch {
    return "";
  }
}

function nowClock() {
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

async function checkLoginStatus() {
  try {
    const resp = await fetch("/api/auth/me");
    const data = await resp.json();
    if (data.logged_in && data.user) {
      currentUser = data.user;
      showAppPage();
    } else {
      showLoginPage();
    }
  } catch (e) {
    showLoginPage();
  }
}

function showLoginPage() {
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("appContainer").classList.remove("show");
}

function showAppPage() {
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("appContainer").classList.add("show");

  if (currentUser) {
    const avatarEl = document.getElementById("userAvatar");
    const nameEl = document.getElementById("userName");
    if (currentUser.avatar_url) {
      avatarEl.innerHTML = `<img src="${currentUser.avatar_url}" alt="avatar" class="h-full w-full object-cover">`;
    } else {
      avatarEl.textContent = userInitial();
    }
    nameEl.textContent = currentUser.username;
  }

  loadConversations().then(() => renderHistory());
  checkKBStatus();
}

async function loginWithGithub() {
  try {
    const resp = await fetch("/api/auth/github");
    const data = await resp.json();
    if (data.auth_url) window.location.href = data.auth_url;
  } catch (e) {
    alert("登录失败，请重试");
  }
}

async function logout() {
  await fetch("/api/auth/logout", { method: "POST" });
  currentUser = null;
  showLoginPage();
}

uploadDocBtn.onclick = function () {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".txt,.md,.csv,.json,.pdf";
  input.multiple = true;
  input.onchange = async () => {
    for (const f of input.files) {
      const form = new FormData();
      form.append("file", f);
      await fetch("/api/kb/upload", { method: "POST", body: form });
    }
    checkKBStatus();
    alert("已上传 " + input.files.length + " 个文件，点击「重建索引」生效。");
  };
  input.click();
};

rebuildBtn.onclick = async function () {
  const label = document.getElementById("rebuildBtnText");
  if (label) label.textContent = "重建中...";
  await fetch("/api/kb/rebuild", { method: "POST" });
  checkKBStatus();
};

async function checkKBStatus() {
  try {
    const r = await fetch("/api/kb/status");
    const d = await r.json();
    const label = document.getElementById("rebuildBtnText");
    if (label) {
      label.textContent = "重建索引 (" + d.file_count + "个" + (d.has_index ? " ✓" : "") + ")";
    }
    renderFileList(d.files || []);
  } catch (e) {}
}

function renderFileList(files) {
  const list = document.getElementById("fileList");
  if (!list) return;
  list.innerHTML = "";
  if (!files.length) {
    list.innerHTML = '<div class="px-1 py-1 text-[11px] text-slate-400">暂无文档</div>';
    return;
  }
  files.forEach((name) => {
    const item = document.createElement("div");
    item.className = "group flex items-center justify-between gap-2 rounded-md px-1 py-1 text-[11px] text-slate-500 hover:bg-slate-50";
    const span = document.createElement("span");
    span.className = "min-w-0 truncate";
    span.title = name;
    span.textContent = name;
    const del = document.createElement("button");
    del.className = "shrink-0 text-slate-300 opacity-0 transition group-hover:opacity-100 hover:text-red-500";
    del.title = "删除";
    del.innerHTML = '<iconify-icon icon="solar:trash-bin-minimalistic-linear" width="14"></iconify-icon>';
    del.onclick = async () => {
      if (!confirm("删除 " + name + "？")) return;
      await fetch("/api/kb/files/" + encodeURIComponent(name), { method: "DELETE" });
      checkKBStatus();
    };
    item.appendChild(span);
    item.appendChild(del);
    list.appendChild(item);
  });
}

async function loadConversations() {
  try {
    const resp = await fetch("/api/conversations");
    const data = await resp.json();
    chatHistory = data.conversations || [];
  } catch (e) {
    chatHistory = [];
  }
}

function renderHistory() {
  historyList.innerHTML = "";
  if (!chatHistory.length) {
    historyList.innerHTML = '<div class="px-3 py-2 text-[12px] text-slate-400">暂无历史会话</div>';
    return;
  }
  chatHistory.forEach((item) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className =
      "conversation flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left transition hover:bg-slate-100" +
      (item.thread_id === threadId ? " active" : "");
    btn.innerHTML =
      '<iconify-icon class="flex-none text-slate-400" icon="solar:chat-round-dots-linear" width="18"></iconify-icon>' +
      '<span class="conv-title min-w-0 flex-1 truncate text-[13px] font-medium text-slate-600"></span>' +
      '<span class="shrink-0 text-[10px] text-slate-400"></span>';
    btn.querySelector(".conv-title").textContent = item.title || "未命名对话";
    btn.querySelector("span:last-child").textContent = formatRelativeTime(item.updated_at);
    btn.onclick = () => switchChat(item.thread_id);
    historyList.appendChild(btn);
  });
  updateChatHeader();
}

function updateChatHeader() {
  const cur = chatHistory.find((c) => c.thread_id === threadId);
  chatTitle.textContent = (cur && cur.title) || "新对话";
}

async function switchChat(tid) {
  closeSidebar();
  threadId = tid;
  clearMessages(false);
  try {
    const resp = await fetch("/api/conversations/" + tid);
    const data = await resp.json();
    const list = data.messages || [];
    if (list.length > 0) {
      for (const m of list) {
        addMsg(m.role === "human" ? "user" : "ai", m.content);
      }
    } else {
      showWelcome();
    }
  } catch (e) {
    showWelcome();
  }
  renderHistory();
}

function startNewChat() {
  closeSidebar();
  threadId = Math.random().toString(36).slice(2);
  clearMessages(true);
  renderHistory();
  document.getElementById("userInput").focus();
}

newChatBtn.onclick = startNewChat;

function toggleSidebar() {
  document.querySelector(".sidebar").classList.toggle("mobile-open");
  document.getElementById("mobileOverlay").classList.toggle("show");
}
function closeSidebar() {
  document.querySelector(".sidebar").classList.remove("mobile-open");
  document.getElementById("mobileOverlay").classList.remove("show");
}

function hideWelcome() {
  const w = document.getElementById("welcomeMsg");
  if (w) w.style.display = "none";
}
function showWelcome() {
  const w = document.getElementById("welcomeMsg");
  if (w) w.style.display = "flex";
}
function clearMessages(showWel) {
  messageInner.innerHTML = "";
  const welcome = document.createElement("div");
  welcome.id = "welcomeMsg";
  welcome.className = "welcome flex flex-col items-center justify-center py-16 text-center";
  welcome.innerHTML =
    '<div class="mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#3157d5] text-white shadow-lg shadow-blue-200">' +
    '<iconify-icon icon="solar:stars-minimalistic-bold" width="28"></iconify-icon></div>' +
    '<div class="text-[18px] font-bold text-slate-800">你好，我是知识库助手</div>' +
    '<div class="mt-2 max-w-[420px] text-[14px] leading-7 text-slate-400">' +
    "可以问我关于文档的任何问题<br>比如「这个项目怎么部署？」「有哪些技术栈？」</div>";
  messageInner.appendChild(welcome);
  if (!showWel) hideWelcome();
  else showWelcome();
  chatTitle.textContent = "新对话";
}

function addMsg(role, text) {
  hideWelcome();
  const wrap = document.createElement("div");
  wrap.className = "message-enter mb-7 flex gap-3 " + (role === "user" ? "justify-end" : "items-start");
  const clock = nowClock();

  if (role === "user") {
    wrap.innerHTML =
      '<div class="max-w-[600px]">' +
      '<div class="mb-1.5 flex justify-end gap-2">' +
      '<span class="text-[10px] text-slate-400">' + clock + "</span>" +
      '<span class="text-[12px] font-bold text-slate-800">我</span></div>' +
      '<div class="user-bubble rounded-2xl rounded-tr-md bg-[#3157d5] px-5 py-4 text-[14px] leading-7 text-white shadow-sm whitespace-pre-wrap"></div></div>' +
      '<div class="user-side-avatar flex h-8 w-8 flex-none items-center justify-center overflow-hidden rounded-full bg-[#dce5ff] text-[12px] font-bold text-[#3157d5]"></div>';
    wrap.querySelector(".user-bubble").textContent = text;
    wrap.querySelector(".user-side-avatar").innerHTML = userAvatarHtml();
    messageInner.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
    return wrap.querySelector(".user-bubble");
  }

  wrap.innerHTML =
    '<div class="flex h-8 w-8 flex-none items-center justify-center rounded-full bg-[#3157d5] text-white">' +
    '<iconify-icon icon="solar:stars-minimalistic-bold" width="17"></iconify-icon></div>' +
    '<div class="max-w-[680px] min-w-0 flex-1">' +
    '<div class="mb-1.5 flex items-center gap-2">' +
    '<span class="text-[12px] font-bold text-slate-800">知识库助手</span>' +
    '<span class="text-[10px] text-slate-400">' + clock + "</span></div>" +
    '<div class="ai-content rounded-2xl rounded-tl-md border border-slate-200 bg-[#f7f8fb] px-5 py-4 text-[14px] leading-7 text-slate-700"></div>' +
    '<div class="ai-actions mt-2 flex gap-3 text-[11px] text-slate-400"></div></div>';

  const content = wrap.querySelector(".ai-content");
  content.innerHTML = marked.parse(text || "");
  content.dataset.raw = text || "";

  const actions = wrap.querySelector(".ai-actions");
  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.className = "flex items-center gap-1 hover:text-[#3157d5]";
  copyBtn.innerHTML = '<iconify-icon icon="solar:copy-linear" width="14"></iconify-icon>复制';
  copyBtn.addEventListener("click", async (e) => {
    e.stopPropagation();
    const raw = content.dataset.raw || text || "";
    try {
      await navigator.clipboard.writeText(raw);
      copyBtn.innerHTML = '<iconify-icon icon="solar:check-circle-linear" width="14"></iconify-icon>已复制';
    } catch {
      const ta = document.createElement("textarea");
      ta.value = raw;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      copyBtn.innerHTML = '<iconify-icon icon="solar:check-circle-linear" width="14"></iconify-icon>已复制';
    }
    setTimeout(() => {
      copyBtn.innerHTML = '<iconify-icon icon="solar:copy-linear" width="14"></iconify-icon>复制';
    }, 1500);
  });
  actions.appendChild(copyBtn);

  messageInner.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
  return content;
}

function addToolHint() {
  const wrap = document.createElement("div");
  wrap.className = "mb-3 flex items-center gap-2 pl-11 text-[12px] text-slate-400";
  wrap.innerHTML =
    '<iconify-icon icon="solar:widget-2-linear" width="14" class="text-[#3157d5]"></iconify-icon>' +
    "<span>正在检索知识库...</span>";
  messageInner.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
  return wrap;
}

async function send() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  if (abortController) {
    abortController.abort();
    abortController = null;
  }

  addMsg("user", text);
  input.value = "";

  const exist = chatHistory.find((c) => c.thread_id === threadId);
  if (!exist) {
    chatHistory.unshift({
      title: text.slice(0, 22) + (text.length > 22 ? "..." : ""),
      thread_id: threadId,
      updated_at: new Date().toISOString(),
    });
    renderHistory();
  }
  chatTitle.textContent = exist ? exist.title || "对话" : chatHistory[0].title;

  const aiDiv = addMsg("ai", "");
  let fullText = "";
  let toolShown = false;
  abortController = new AbortController();

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, thread_id: threadId }),
      signal: abortController.signal,
    });

    if (!resp.ok) {
      let err = "请求失败 (" + resp.status + ")";
      try {
        const j = await resp.json();
        err = j.error || j.detail || err;
      } catch (_) {}
      aiDiv.textContent = "出错了：" + err;
      return;
    }

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    let end = false;

    while (!end) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });

      const parts = buf.split("\n");
      buf = parts.pop() || "";

      for (const line of parts) {
        if (!line.startsWith("data: ")) continue;
        let json;
        try {
          json = JSON.parse(line.slice(6));
        } catch {
          continue;
        }

        if (json.error) aiDiv.textContent = "出错了：" + json.error;
        if (json.tool && !toolShown) {
          toolShown = true;
          addToolHint();
        }
        if (json.text) {
          fullText += json.text;
          aiDiv.innerHTML = marked.parse(fullText);
          aiDiv.dataset.raw = fullText;
        }
        if (json.done) {
          end = true;
          break;
        }
      }
      msgs.scrollTop = msgs.scrollHeight;
    }
  } catch (e) {
    if (e.name !== "AbortError") {
      aiDiv.textContent = "网络错误：" + e.message;
    }
  }

  abortController = null;
  loadConversations().then(() => renderHistory());
}

document.getElementById("userInput").addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

document.querySelectorAll(".suggestion").forEach(function (button) {
  button.addEventListener("click", function () {
    const input = document.getElementById("userInput");
    input.value = button.textContent;
    input.focus();
  });
});

checkLoginStatus();
</script>
