<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库客服</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;
  background:#ffffff;
  color:#1f2937;
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* ========== 左侧侧边栏 ========== */
.sidebar{
  width:260px;
  background:#111827;
  color:#e5e7eb;
  display:flex;
  flex-direction:column;
  padding:16px 12px;
}
/* 侧边栏顶部用户区域 */
.sidebar-top-user{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 6px 16px;
  border-bottom:1px solid #272f3f;
  margin-bottom:16px;
}
.user-avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#3b82f6;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  flex-shrink:0;
  cursor:pointer;
}
.user-name{
  font-size:14px;
  color:#e5e7eb;
}

/* 添加知识库文档按钮 */
.upload-doc-btn{
  width:100%;
  padding:10px 14px;
  background:#2563eb;
  border:none;
  border-radius:10px;
  color:#fff;
  cursor:pointer;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  transition:opacity 0.2s;
}
.upload-doc-btn:hover{
  opacity:0.9;
}

.new-chat-btn{
  width:100%;
  padding:10px 14px;
  background:#1f2937;
  border:1px solid #374151;
  border-radius:10px;
  color:#f9fafb;
  cursor:pointer;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:20px;
  transition:background 0.2s;
}
.new-chat-btn:hover{
  background:#374151;
}

.history-title{
  font-size:12px;
  color:#9ca3af;
  padding:0 6px 8px;
}
.history-list{
  flex:1;
  overflow-y:auto;
}
.history-item{
  padding:9px 10px;
  border-radius:8px;
  font-size:14px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:4px;
}
.history-item:hover{
  background:#1f2937;
}
.history-item.active{
  background:#273449;
}

/* ========== 右侧对话主区域 ========== */
.main-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#f9fafb;
}
.header{
  height:52px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  padding:0 20px;
  font-size:15px;
  font-weight:600;
  color:#374151;
}
.messages{
  flex:1;
  overflow-y:auto;
  padding:24px 0;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.msg-wrap{
  width:100%;
  max-width:720px;
  padding:0 24px;
  display:flex;
  margin-bottom:18px;
}
.msg-wrap.user{ justify-content:flex-end; }
.msg-wrap.ai{ justify-content:flex-start; }
.msg{
  max-width:85%;
  line-height:1.75;
  font-size:15px;
  padding:10px 16px;
  border-radius:16px;
  word-break:break-word;
  white-space:pre-wrap;
}
.msg-wrap.user .msg{
  background:#1677ff;
  color:#fff;
  border-bottom-right-radius:4px;
}
.msg-wrap.ai .msg{
  background:#fff;
  color:#1f2937;
  border:1px solid #e5e7eb;
  border-bottom-left-radius:4px;
}
.tool-wrap{
  width:100%;
  max-width:720px;
  padding:0 24px;
  margin-bottom:4px;
  display:flex;
}
.tool{
  color:#9ca3af;
  font-size:12px;
  padding:2px 0;
}
.input-wrap{
  background:#fff;
  border-top:1px solid #e5e7eb;
  padding:14px 0;
}
.input-box{
  max-width:720px;
  margin:0 auto;
  padding:0 24px;
  display:flex;
  gap:8px;
  align-items:flex-end;
}
.input-box textarea{
  flex:1;
  border:1px solid #d1d5db;
  outline:none;
  font-size:15px;
  padding:10px 14px;
  border-radius:12px;
  min-height:44px;
  max-height:160px;
  resize:none;
  background:#fff;
  font-family:inherit;
}
.input-box textarea:focus{
  border-color:#1677ff;
  box-shadow:0 0 0 2px rgba(22,119,255,.15);
}
.input-box button{
  padding:10px 20px;
  background:#1677ff;
  color:#fff;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
  flex-shrink:0;
  transition:background .2s;
}
.input-box button:hover{ background:#0958d9; }
.input-box textarea{
  flex:1;
  border:none;
  outline:none;
  font-size:15px;
  min-height:44px;
  max-height:160px;
  resize:none;
  background:transparent;
}
.input-box button{
  padding:10px 22px;
  background:#1677ff;
  color:#fff;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;
  transition:opacity 0.2s;
}
.input-box button:hover{
  opacity:0.9;
}

/* 滚动条美化 */
.messages::-webkit-scrollbar,
.history-list::-webkit-scrollbar{
  width:6px;
}
.messages::-webkit-scrollbar-thumb,
.history-list::-webkit-scrollbar-thumb{
  background:#d1d5db;
  border-radius:3px;
}
.history-list::-webkit-scrollbar-track{
  background:transparent;
}
</style>
</head>
<body>

<!-- 左侧侧边栏 -->
<div class="sidebar">
  <!-- 左上角用户头像区域 -->
  <div class="sidebar-top-user">
    <div class="user-avatar">U</div>
    <div class="user-name">登录用户</div>
  </div>

  <!-- 顺序调整：上传文档放在最上方 -->
  <button class="upload-doc-btn" id="rebuildBtn">🔄 重建索引</button>
	  <button class="upload-doc-btn" id="uploadDocBtn">📄 添加知识库文档</button>
  <button class="new-chat-btn" id="newChatBtn">＋ 新对话</button>

  <div class="history-title">历史对话</div>
  <div class="history-list" id="historyList"></div>
</div>

<!-- 右侧对话区域 -->
<div class="main-wrap">
  <div class="header">知识库客服</div>
  <div class="messages" id="messages"></div>

  <div class="input-wrap">
    <div class="input-box">
      <textarea id="userInput" placeholder="输入问题，回车发送，Shift+Enter换行"></textarea>
      <button onclick="send()">发送</button>
    </div>
  </div>
</div>

<script>
const msgs = document.getElementById("messages");
const historyList = document.getElementById("historyList");
const newChatBtn = document.getElementById("newChatBtn");
const rebuildBtn = document.getElementById("rebuildBtn");
const uploadDocBtn = document.getElementById("uploadDocBtn");

let threadId = Math.random().toString(36).slice(2);
let abortController = null;   // 取消上一次请求
// 历史会话存储：[{title, threadId}]
let chatHistory = [];

// =========【添加知识库文档点击事件】========
uploadDocBtn.onclick = function(){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".txt,.md,.pdf";
  input.multiple = true;
  input.onchange = async () => {
    for (const f of input.files) {
      const form = new FormData();
      form.append("file", f);
      await fetch("/api/kb/upload", { method: "POST", body: form });
    }
    checkKBStatus();
    alert("已上传 " + input.files.length + " 个文件，点击\"重建索引\"生效。");
  };
  input.click();
};

// 渲染侧边历史列表
function renderHistory(){
  historyList.innerHTML = "";
  chatHistory.forEach((item, idx)=>{
    const div = document.createElement("div");
    div.className = "history-item" + (item.threadId === threadId ? " active" : "");
    div.textContent = item.title;
    div.title = item.title;
    div.onclick = ()=>switchChat(item.threadId);
    historyList.appendChild(div);
  })
}

// 切换会话
function switchChat(tid){
  threadId = tid;
  msgs.innerHTML = "";
  renderHistory();
}

// 新建对话
newChatBtn.onclick = function(){
  threadId = Math.random().toString(36).slice(2);
  msgs.innerHTML = "";
  renderHistory();
}

async function send() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  // 取消上一次未完成的请求
  if (abortController) {
    abortController.abort();
    abortController = null;
  }

  addMsg("user", text);
  input.value = "";

  const exist = chatHistory.find(c=>c.threadId === threadId);
  if(!exist){
    chatHistory.unshift({
      title: text.slice(0,22) + (text.length>22?"...":""),
      threadId: threadId
    })
    renderHistory();
  }

  const aiDiv = addMsg("ai", "");
  let fullText = "";

  abortController = new AbortController();

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, thread_id: threadId}),
      signal: abortController.signal,
    });

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";

    let end = false;
    while (!end) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});

      for (const line of buf.split("\n")) {
        if (!line.startsWith("data: ")) continue;
        const json = JSON.parse(line.slice(6));

        if (json.error) {
          aiDiv.textContent = "出错了：" + json.error;
        }
        if (json.tool) {
          const toolWrap = document.createElement("div");
          toolWrap.className = "tool-wrap";
          const toolDiv = document.createElement("div");
          toolDiv.className = "tool";
          toolDiv.textContent = "🔧 " + json.tool;
          toolWrap.appendChild(toolDiv);
          msgs.appendChild(toolWrap);
        }
        if (json.text) {
          fullText += json.text;
          aiDiv.textContent = fullText;
        }
        if (json.done) { end = true; break; }
      }
      buf = buf.split("\n").pop() || "";
      msgs.scrollTop = msgs.scrollHeight;
    }
  } catch (e) {
    if (e.name !== "AbortError") {
      aiDiv.textContent = "网络错误：" + e.message;
    }
  }

  abortController = null;
}

function addMsg(role, text) {
  const wrap = document.createElement("div");
  wrap.className = "msg-wrap " + role;

  const msg = document.createElement("div");
  msg.className = "msg";
  msg.textContent = text;
  wrap.appendChild(msg);
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
  return msg;
}

// 回车发送 Shift+Enter换行
document.getElementById('userInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    send();
  }
})

renderHistory();
checkKBStatus();

async function checkKBStatus() {
  try {
    const r = await fetch("/api/kb/status");
    const d = await r.json();
    const btn = document.getElementById("rebuildBtn");
    if (btn) {
      btn.textContent = "🔄 重建索引 (" + d.file_count + "个文档" + (d.has_index ? " ✅" : " ❌") + ")";
    }
  } catch(e) {}
}

rebuildBtn.onclick = async function() {
  rebuildBtn.textContent = "  重建中...";
  const r = await fetch("/api/kb/rebuild", { method: "POST" });
  const d = await r.json();
  rebuildBtn.textContent = "   重建索引 ";
  setTimeout(checkKBStatus, 2000);
};
</script>
</body>
</html>
